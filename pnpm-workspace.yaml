packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true

# Packages allowed to run install/postinstall scripts.
onlyBuiltDependencies:
  - esbuild
  - '@swc/core'
  - unrs-resolver
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
